[package]
name = "yfine2"
version = "0.1.0"
description = "Yfine — a private, local-first personal-finance desktop app (Tauri 2 + SQLite)."
authors = ["AlexDevFlow"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AlexDevFlow/yfine2"
homepage = "https://github.com/AlexDevFlow/yfine2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yfine2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The unlock path runs two PBKDF2-HMAC-SHA256 derivations at 480k iters each
# (verify password + derive decryption key). At opt-level 0 the sha2/pbkdf2 crates
# are ~10-40x slower, so a plain `tauri dev` debug build takes many seconds to open
# with a password. Build all dependencies optimized even in dev — our own crate
# stays at debug opt-level so it remains debuggable — which brings unlock back to
# sub-second (matching release). Deps only rebuild once, so dev iteration is unaffected.
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# At-rest encryption parity with the legacy app (yfine.db.enc):
# AES-256-GCM + PBKDF2-HMAC-SHA256 @ 480k iters, legacy Fernet read.
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
fernet = "0.2"

# `fernet` (legacy Fernet archive decryption) pulls `openssl-sys`, which can't find
# a system OpenSSL on the Windows runners, nor for the x86_64 slice of the universal
# macOS cross-build (the arm64 runner has no x86_64 system OpenSSL). Build OpenSSL
# from source (vendored) on Windows AND macOS; Linux keeps the fast system OpenSSL.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# macOS-only: dispatch2 0.3.1 (pulled transitively by tao -> tauri) overflows the
# default macro recursion limit while expanding its bitflags bindings on current
# rustc, so the universal-apple-darwin build fails ("recursion limit reached").
# Its version is locked by tao (no newer 0.3.x), so we vendor an IDENTICAL 0.3.1
# under vendor/dispatch2 with `#![recursion_limit = "1024"]` added — the only diff.
# Remove this patch once a tao-compatible upstream release ships the fix.
[patch.crates-io]
dispatch2 = { path = "vendor/dispatch2" }

