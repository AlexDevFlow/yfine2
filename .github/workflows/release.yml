name: Build Yfine desktop installers

# Produces native installers (.AppImage/.deb, .dmg, .msi) on tag push.
# No code signing/notarization — unsigned builds; the README documents the
# per-OS first-launch bypass. Paths resolve from the repo root (standalone
# yfine2 repo: this file lives at .github/workflows/release.yml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      # Required so the default GITHUB_TOKEN may create the Release + upload
      # the installers (the token is read-only by default on many repos).
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            # One installer for both Intel and Apple Silicon Macs.
            args: "--target universal-apple-darwin"
          - platform: windows-2022
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Pinned: rustc 1.96 hits a recursion-limit error compiling the macOS-only
      # `dispatch2` crate (transitive via tao/tauri); 1.93 predates it and also
      # makes the build reproducible. Bump deliberately, not on every CI run.
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Yfine ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
